<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OCPP Full Session Demo</title>
  <style>
    body { font-family: Arial; padding: 2rem; }
    button { margin-right: 0.5rem; margin-top: 0.5rem; }
    pre { background: #f4f4f4; padding: 1rem; min-height: 180px; }
  </style>
</head>
<body>
  <h2>EV Charging Platform – OCPP Demo</h2>
  <p><strong>Charger:</strong> DEMO-CHARGER-001</p>

  <button onclick="connect()">Connect</button>
  <button onclick="boot()">Boot</button>
  <button onclick="start()">Start Transaction</button>
  <button onclick="stop()">Stop Transaction</button>
  <button onclick="heartbeat()">Heartbeat</button>

  <pre id="log"></pre>

  <script>
    let socket;
    let activeTransactionId;
    const logEl = document.getElementById('log');

    const log = (m) => logEl.textContent += m + '\n';
    const id = () => Math.random().toString(36).substring(2, 8);

    function connect() {
      socket = new WebSocket(
        'ws://localhost:3000/ocpp?chargerId=DEMO-CHARGER-001',
        ['ocpp1.6']
      );
      socket.onopen = () => log('Connected');
      socket.onmessage = e => {
        log('Received: ' + e.data);
        const msg = JSON.parse(e.data);
        if (msg[2]?.transactionId) {
          activeTransactionId = msg[2].transactionId;
        }
      };
    }

    function boot() {
      socket.send(JSON.stringify([
        2, id(), 'BootNotification',
        { chargePointVendor: 'CloudTunnel', chargePointModel: 'CT-AC-7KW' }
      ]));
    }

    function start() {
      socket.send(JSON.stringify([
        2, id(), 'StartTransaction',
        {
          connectorId: 1,
          idTag: 'RFID-12345',
          meterStart: 0,
          timestamp: new Date().toISOString()
        }
      ]));
    }

    function stop() {
      socket.send(JSON.stringify([
        2, id(), 'StopTransaction',
        {
          transactionId: activeTransactionId,
          meterStop: 12,
          timestamp: new Date().toISOString(),
          reason: 'Local'
        }
      ]));
    }

    function heartbeat() {
      socket.send(JSON.stringify([2, id(), 'Heartbeat', {}]));
    }
  </script>
</body>
</html>
