<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OCPP Charger Simulator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f6f7f9;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 1.5rem;
    }

    button {
      padding: 0.5rem 0.75rem;
      margin-right: 0.5rem;
      margin-top: 0.5rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    pre {
      margin-top: 1.5rem;
      background: #111;
      color: #0f0;
      padding: 1rem;
      border-radius: 6px;
      height: 220px;
      overflow: auto;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>OCPP Charger Simulator</h1>
  <div class="subtitle">Charger: DEMO-CHARGER-001</div>

  <div>
    <button onclick="connect()">Connect</button>
    <button onclick="boot()">Boot</button>
    <button onclick="start()">Start</button>
    <button onclick="heartbeat()">Heartbeat</button>
    <button onclick="stop()">Stop</button>
  </div>

  <pre id="log"></pre>

  <script>
    let socket;
    let activeTransactionId;
    const logEl = document.getElementById('log');

    const log = (m) => {
      logEl.textContent += m + '\n';
      logEl.scrollTop = logEl.scrollHeight;
    };

    const id = () => Math.random().toString(36).substring(2, 8);

    function connect() {
      socket = new WebSocket(
        'ws://localhost:3000/ocpp?chargerId=DEMO-CHARGER-001',
        ['ocpp1.6']
      );

      socket.onopen = () => log('CONNECTED');
      socket.onmessage = e => {
        log('RECV: ' + e.data);
        const msg = JSON.parse(e.data);
        if (msg[2]?.transactionId) {
          activeTransactionId = msg[2].transactionId;
        }
      };
      socket.onclose = () => log('DISCONNECTED');
    }

    function boot() {
      socket.send(JSON.stringify([
        2, id(), 'BootNotification',
        { chargePointVendor: 'CloudTunnel', chargePointModel: 'CT-AC-7KW' }
      ]));
      log('SEND: BootNotification');
    }

    function start() {
      socket.send(JSON.stringify([
        2, id(), 'StartTransaction',
        {
          connectorId: 1,
          idTag: 'RFID-12345',
          meterStart: 0,
          timestamp: new Date().toISOString()
        }
      ]));
      log('SEND: StartTransaction');
    }

    function stop() {
      socket.send(JSON.stringify([
        2, id(), 'StopTransaction',
        {
          transactionId: activeTransactionId,
          meterStop: 12,
          timestamp: new Date().toISOString(),
          reason: 'Local'
        }
      ]));
      log('SEND: StopTransaction');
    }

    function heartbeat() {
      socket.send(JSON.stringify([2, id(), 'Heartbeat', {}]));
      log('SEND: Heartbeat');
    }
  </script>
</body>
</html>
