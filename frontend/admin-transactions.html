<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EV Charging Platform – Transactions</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f6f7f9;
      padding: 2rem;
      color: #222;
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }

    th {
      background: #fafafa;
      font-weight: 600;
      color: #444;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .muted {
      color: #888;
      font-size: 0.8rem;
    }

    .badge {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .ok {
      background: #e6f4ea;
      color: #137333;
    }

    .warn {
      background: #fce8e6;
      color: #a50e0e;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #888;
    }
  </style>
</head>

<body>

  <h1>EV Charging Platform</h1>
  <div class="subtitle">Admin Dashboard – Transactions</div>

  <table>
    <thead>
      <tr>
        <th>Charger ID</th>
        <th>OCPP Tx ID</th>
        <th>ID Tag</th>
        <th>Meter Start</th>
        <th>Meter Stop</th>
        <th>Started At</th>
        <th>Stopped At</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <footer>
    Cloud Tunnel · EV Charging Platform · MVP
  </footer>

  <script>
    async function loadTransactions() {
      const res = await fetch('http://localhost:3000/admin/transactions');
      const data = await res.json();

      const rows = document.getElementById('rows');
      rows.innerHTML = '';

      data.forEach(tx => {
        const tr = document.createElement('tr');

        const active = !tx.stoppedAt;

        tr.innerHTML = `
          <td>${tx.chargerId}</td>
          <td>${tx.ocppTransactionId}</td>
          <td>${tx.idTag}</td>
          <td>${tx.meterStart}</td>
          <td>${tx.meterStop ?? '-'}</td>
          <td class="muted">${new Date(tx.startedAt).toLocaleString()}</td>
          <td class="muted">${tx.stoppedAt ? new Date(tx.stoppedAt).toLocaleString() : '-'}</td>
          <td>
            <span class="badge ${active ? 'warn' : 'ok'}">
              ${active ? 'Active' : 'Completed'}
            </span>
          </td>
        `;

        rows.appendChild(tr);
      });
    }

    loadTransactions();
    setInterval(loadTransactions, 2000);
  </script>

</body>
</html>
