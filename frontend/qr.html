<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cloud Tunnel — QR Start</title>
    <style>
      :root {
        --bg: #070b14;
        --bg2: #0f172a;
        --card: rgba(255, 255, 255, 0.08);
        --border: rgba(148, 163, 184, 0.2);
        --text: #e5e7eb;
        --muted: rgba(226, 232, 240, 0.65);
        --primary: #22d3ee;
        --accent: #f59e0b;
        --good: #22c55e;
        --bad: #ef4444;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(34, 211, 238, 0.25), transparent 55%),
          radial-gradient(900px 500px at 85% 12%, rgba(245, 158, 11, 0.18), transparent 55%),
          linear-gradient(180deg, var(--bg), var(--bg2));
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .shell {
        width: min(640px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 26px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 900;
        letter-spacing: -0.4px;
      }

      .sub {
        color: var(--muted);
        margin-top: 6px;
        font-size: 14px;
      }

      .card {
        margin-top: 18px;
        padding: 16px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
      }

      .grid {
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 13px;
        font-weight: 800;
        color: rgba(226, 232, 240, 0.85);
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
        outline: none;
      }

      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        flex: 1;
        min-width: 140px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.9), rgba(14, 116, 144, 0.9));
        color: #03131d;
        font-weight: 900;
        padding: 12px 14px;
        border-radius: 999px;
        cursor: pointer;
      }

      .btn.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      .status {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 14px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.6);
      }

      .status.good { border-color: rgba(34, 197, 94, 0.6); color: var(--good); }
      .status.bad { border-color: rgba(239, 68, 68, 0.6); color: var(--bad); }
      .status.warn { border-color: rgba(245, 158, 11, 0.6); color: var(--accent); }

      .meta {
        margin-top: 10px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>Charge via QR</h1>
      <div class="sub" id="subtitle">Resolving QR…</div>

      <div class="card">
        <div class="grid">
          <div>
            <label>Driver RFID / ID Tag</label>
            <input id="idTagInput" placeholder="Enter RFID or driver tag" />
          </div>
          <div>
            <label>Transaction ID (for stop)</label>
            <input id="txInput" type="number" placeholder="e.g. 1051" />
          </div>
        </div>
        <div class="row" style="margin-top: 14px;">
          <button class="btn" id="btnStart">Start charging</button>
          <button class="btn secondary" id="btnStop">Stop charging</button>
        </div>
        <div class="status" id="statusBox">Waiting for QR data…</div>
        <div class="meta" id="metaBox">API: —</div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const code = params.get('code') || (location.hash || '').replace('#', '').trim();
      const API_BASE = params.get('api') || 'http://localhost:3001';

      const els = {
        subtitle: document.getElementById('subtitle'),
        status: document.getElementById('statusBox'),
        meta: document.getElementById('metaBox'),
        idTag: document.getElementById('idTagInput'),
        tx: document.getElementById('txInput'),
        btnStart: document.getElementById('btnStart'),
        btnStop: document.getElementById('btnStop'),
      };

      function setStatus(type, msg) {
        els.status.className = `status ${type || ''}`;
        els.status.textContent = msg;
      }

      async function fetchJson(url, opts) {
        const res = await fetch(url, opts);
        const text = await res.text();
        let data = null;
        try { data = JSON.parse(text); } catch { data = text; }
        if (!res.ok) {
          const msg = data?.error || data?.message || text || `HTTP ${res.status}`;
          throw new Error(msg);
        }
        return data;
      }

      async function loadQr() {
        if (!code) {
          setStatus('bad', 'Missing QR code in the URL.');
          els.subtitle.textContent = 'QR code not provided.';
          return;
        }

        try {
          const data = await fetchJson(`${API_BASE}/public/qr/${encodeURIComponent(code)}`);
          if (!data?.ok) throw new Error(data?.error || 'QR not found');

          const locationName = data?.qr?.location?.name || 'Unknown location';
          const charger = data?.qr?.charger?.chargerId || 'Unlinked';
          const connector = data?.qr?.connectorId || '—';
          els.subtitle.textContent = `${locationName} • Charger ${charger} • Connector ${connector}`;
          setStatus('', 'Ready to start a session.');
          els.meta.textContent = `API: ${API_BASE} · QR: ${code}`;
        } catch (err) {
          setStatus('bad', String(err?.message || err));
          els.subtitle.textContent = 'Unable to resolve QR.';
        }
      }

      function idempotencyKey() {
        return crypto?.randomUUID ? crypto.randomUUID() : String(Date.now());
      }

      async function startCharging() {
        const idTag = String(els.idTag.value || '').trim();
        if (!idTag) {
          setStatus('warn', 'Please enter an RFID / ID Tag.');
          return;
        }
        setStatus('', 'Sending start command…');
        try {
          const res = await fetchJson(`${API_BASE}/public/qr/${encodeURIComponent(code)}/start`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'idempotency-key': idempotencyKey(),
            },
            body: JSON.stringify({ idTag }),
          });
          if (res?.ok) {
            const msg = res?.pending
              ? `Start already pending (message ${res.messageId}).`
              : `Start command sent (message ${res.messageId}).`;
            setStatus('good', msg);
          } else {
            setStatus('bad', res?.error || 'Start failed.');
          }
        } catch (err) {
          setStatus('bad', String(err?.message || err));
        }
      }

      async function stopCharging() {
        const txId = Number(els.tx.value);
        if (!Number.isFinite(txId)) {
          setStatus('warn', 'Enter a valid transaction ID.');
          return;
        }
        setStatus('', 'Sending stop command…');
        try {
          const res = await fetchJson(`${API_BASE}/public/qr/${encodeURIComponent(code)}/stop`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'idempotency-key': idempotencyKey(),
            },
            body: JSON.stringify({ transactionId: txId }),
          });
          if (res?.ok) {
            const msg = res?.pending
              ? `Stop already pending (message ${res.messageId}).`
              : `Stop command sent (message ${res.messageId}).`;
            setStatus('good', msg);
          } else {
            setStatus('bad', res?.error || 'Stop failed.');
          }
        } catch (err) {
          setStatus('bad', String(err?.message || err));
        }
      }

      els.btnStart.addEventListener('click', startCharging);
      els.btnStop.addEventListener('click', stopCharging);

      loadQr();
    </script>
  </body>
</html>
