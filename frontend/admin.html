<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EV Charging Platform – Admin</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f6f7f9;
      padding: 2rem;
      color: #222;
    }

    h1 {
      margin-bottom: 0.25rem;
    }

    h2 {
      margin-top: 3rem;
      margin-bottom: 0.75rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 0.75rem;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    th {
      background: #fafafa;
      font-weight: 600;
      color: #444;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .ok {
      background: #e6f4ea;
      color: #137333;
    }

    .warn {
      background: #fce8e6;
      color: #a50e0e;
    }

    .muted {
      color: #888;
      font-size: 0.8rem;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>EV Charging Platform</h1>
  <div class="subtitle">Admin Dashboard – MVP</div>

  <!-- ================= Chargers ================= -->
  <h2>Connected Chargers</h2>

  <table>
    <thead>
      <tr>
        <th>Charger ID</th>
        <th>Connected At</th>
        <th>Registered</th>
        <th>Last Heartbeat</th>
      </tr>
    </thead>
    <tbody id="chargers"></tbody>
  </table>

  <!-- ================= Transactions ================= -->
  <h2>Transactions</h2>

  <table>
    <thead>
      <tr>
        <th>Charger</th>
        <th>OCPP Tx ID</th>
        <th>ID Tag</th>
        <th>Meter Start</th>
        <th>Meter Stop</th>
        <th>Started</th>
        <th>Stopped</th>
        <th>Reason</th>
      </tr>
    </thead>
    <tbody id="transactions"></tbody>
  </table>

  <footer>
    Cloud Tunnel · OCPP 1.6 · MVP
  </footer>

  <script>
    async function loadChargers() {
      const res = await fetch('http://localhost:3000/admin/chargers');
      const data = await res.json();

      const tbody = document.getElementById('chargers');
      tbody.innerHTML = '';

      data.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${c.chargerId}</td>
          <td class="muted">${c.connectedAt ?? '-'}</td>
          <td>
            <span class="badge ${c.registered ? 'ok' : 'warn'}">
              ${c.registered ? 'Registered' : 'Pending'}
            </span>
          </td>
          <td class="muted">${c.lastHeartbeatAt ?? '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function loadTransactions() {
      const res = await fetch('http://localhost:3000/admin/transactions');
      const data = await res.json();

      const tbody = document.getElementById('transactions');
      tbody.innerHTML = '';

      data.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${t.chargerId}</td>
          <td>${t.ocppTransactionId}</td>
          <td>${t.idTag}</td>
          <td>${t.meterStart}</td>
          <td>${t.meterStop ?? '-'}</td>
          <td class="muted">${new Date(t.startedAt).toLocaleString()}</td>
          <td class="muted">${t.stoppedAt ? new Date(t.stoppedAt).toLocaleString() : '-'}</td>
          <td>${t.stopReason ?? '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function refresh() {
      await Promise.all([
        loadChargers(),
        loadTransactions(),
      ]);
    }

    refresh();
    setInterval(refresh, 3000);
  </script>

</body>
</html>
